apply plugin: 'com.android.application'

android {
    compileSdk 35
    namespace "com.milestonesys.mobilesdk.ptzpresets"
    defaultConfig {
        applicationId "com.milestonesys.mobilesdk.ptzpresetssample"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    configurations.implementation {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation project(':mipsdkmobile')
}
